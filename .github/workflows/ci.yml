name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài dự án
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Kiểm tra cú pháp
        run: python -m compileall -q src tests tools scripts

      - name: Chạy kiểm thử
        run: python -m pytest -q
