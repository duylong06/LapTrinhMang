[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "truyennhanh"
version = "0.1.0"
description = "Truyền Nhanh — gửi file trong mạng LAN không cần Internet. Đồ án môn Lập trình mạng."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
do-dac = ["matplotlib>=3.7"]

[project.scripts]
truyennhanh = "truyennhanh.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "cham: test chạy lâu hơn 10 giây; bỏ qua bằng  pytest -m \"not cham\"",
]
